name: CI

# Every change to main is verified, however it arrives.
#
# Cloudflare builds and publishes whatever lands on main, and it does not run
# these checks. This workflow is the only gate, so it has to cover direct
# pushes as well as pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      # tina/__generated__ is gitignored, and src/lib/tina/data.ts imports the
      # generated GraphQL client statically — so on a clean checkout nothing
      # type-checks or builds until the CMS schema is compiled. `tinacms build`
      # with no `-c` runs codegen and exits. --local --skip-cloud-checks reads
      # content from the repo and needs no credentials; see docs/cms.md.
      - name: Generate the CMS client
        run: npx tinacms build --local --skip-cloud-checks

      # Environment-independent: formatting, tokens, types, unit tests.
      - run: npm run format:check
      - run: npm run lint:css

      # The 410 routes are generated from the short-links collection but
      # committed, so `astro check` and code review can see them. Assert they
      # match, or a short-link edit in the CMS silently stops taking effect.
      - name: Generated 410 routes are in sync
        run: |
          node scripts/generate-redirects.mjs
          git diff --exit-code src/pages
      - run: npm run check
      - run: npm run test

      # Build and crawl both deploy targets. `site`, the sitemap and robots.txt
      # are all environment-dependent, and production is the target nobody
      # exercises locally — an indexability mistake there is invisible until it
      # costs the site its search presence. scripts/check-site.mjs asserts
      # robots.txt matches DEPLOY_ENV, but only for the target in front of it,
      # so both have to be built for the assertion to mean anything.
      - name: Verify staging target
        run: npm run build:tina && npm run test:site
        env:
          DEPLOY_ENV: staging

      - name: Verify production target
        run: npm run build:tina && npm run test:site
        env:
          DEPLOY_ENV: production
