name: Scheduled Cloudflare refresh

# The site deploys to Cloudflare (plcc.dev) on every push to `main` via Workers
# Builds. But event data (the calendar feed) is fetched at BUILD time, so it only
# updates when a build runs. Cloudflare has no scheduled/cron build trigger and no
# deploy hook, so this workflow rebuilds and redeploys on a daily schedule to keep
# that build-time event data fresh. It does NOT run on push — Workers Builds
# already handles that.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN   (a token with the "Edit Cloudflare Workers" permissions)
#   - CLOUDFLARE_ACCOUNT_ID  (the account the plcc-web Worker lives in)
on:
  # Daily rebuild so build-time event data stays fresh (13:00 UTC ≈ 5am PST / 6am PDT).
  schedule:
    - cron: '0 13 * * *'
  # Allow manual refreshes from the Actions tab (use this to test after adding secrets).
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - run: npm ci
      # Build the staging target (plcc.dev) with fresh event data, then verify it
      # before shipping, so a broken feed/build never gets deployed.
      - run: DEPLOY_ENV=staging npm run build
      - run: npm run test:site

      # Same command Cloudflare Workers Builds runs; wrangler reads the adapter's
      # config from dist/server/wrangler.json and inherits the existing SESSION KV
      # binding on the deployed Worker.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
