doors:
  - id: serve
    order: 1
    title: Curious how we show up locally?
    intro: Being a good neighbor is part of who we are — we invest in the local
      community through giving and by showing up to serve.
    body: We back trusted local organizations with financial support and our own
      volunteers, bringing time, relationships, and practical help where it’s
      needed most.
    bullets:
      - Issaquah Food & Clothing Bank
      - Bright Bridge
      - Echo Glen
      - Young Life
    ctaLabel: Serving Locally
    href: /neighbors/serve/
  - id: care
    order: 2
    title: Need support right now?
    intro: If you’re in a difficult season — illness, grief, family stress, or
      simply feeling overwhelmed — support at Pine Lake often begins quietly and
      personally.
    body: 'Care here usually looks simple and human: a conversation, prayer if
      that’s meaningful to you, practical help like meals, and connection to
      others who can walk with you.'
    bullets:
      - Pastoral care and prayer
      - Meals and practical support during illness or crisis
      - Support groups, including Alzheimer’s support
      - Care and presence around memorial services and times of loss
    ctaLabel: Care & Support
    href: /neighbors/care/
  - id: space
    order: 3
    title: Need a space to gather?
    intro: We believe our building is a shared community resource.
    body: That means hosting weddings and memorials, and also opening our spaces to
      community groups and nonprofits whose work benefits the wider region.
    bullets:
      - Weddings and memorial services
      - Community groups and nonprofit gatherings
      - Programs that serve the local community
    ctaLabel: Weddings & Memorials
    href: /neighbors/weddings/
  - id: connection
    order: 4
    title: Looking for connection?
    intro: Many people find their way to Pine Lake because they’re new to the area,
      raising young kids, rebuilding community, or looking for something more
      grounded and relational.
    body: There are easy, low-pressure ways to connect — some social, some
      spiritual, some simply about showing up and seeing what fits.
    bullets:
      - MomCo and a weekday community playgroup for parents of young kids
      - Sports camp, Club 45, and Pine Lake Youth for kids and teens
      - Tuesdays Together community meals
      - Community and support groups that meet through the week
    ctaLabel: What’s On
    href: /events/
