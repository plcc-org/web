people:
  - name: Austin Bailey
    title: Lead Pastor
    portrait: /assets/images/Austin-2025-5-web.jpg
    bio: |
      Austin grew up in Texas and studied at North Park University, where he earned degrees in both theology and accounting — an unusual pairing — before a Master of Divinity at the seminary there. He served as a pastor at Covenant churches in Texas and Connecticut for a decade, and the church called him to Pine Lake as lead pastor in 2021. He also coaches within the Covenant, helping people discover their own voice and natural strengths — how to speak with confidence and connect with any audience.

      He and his wife, Ashley, were married in her home state of Connecticut, and they have three kids — Ellie, Gwen, and Stephen. Austin is quick to laugh and never happier than when he's surrounded by people.
    link:
      label: Read a letter from Austin
      href: /about/pastors-letter/
  - name: Becca Worl
    title: 'Associate Pastor, Families & Youth'
    portrait: /assets/images/Becca-2025-5-web.jpg
    bio: |
      Becca grew up as a missionary kid in the Democratic Republic of the Congo, finished high school in Bellingham, and studied at Seattle Pacific University before earning a master's in Theological and Biblical Studies from Fuller Seminary. She joined Pine Lake in 2022 to work with our students, and in 2024 the church called her as an associate pastor. She also speaks at women's retreats.

      She and her husband, Rob, met when they were twelve and have been married more than twenty years. They have two kids, Annabelle and Bradley, and a golden retriever, Kaylee, who is counted firmly as a third. What gets her up in the morning is helping people discover they're loved by God and learn to live rooted in that love. And when she isn't working or parenting, there's a good chance she's out on a trail — or in a coffee shop, drinking coffee, making coffee, or meeting someone for coffee.
  - name: Kyle Harmon
    title: 'Associate Pastor, Worship & Mission'
    portrait: /assets/images/Kyle-2025-5-web.jpg
    bio: |
      Kyle grew up in Denver, leading worship from a young age, and studied cultural anthropology — with minors in theology and music — at Vanguard University, where he met his wife, Joanna. He led modern worship at Bellevue Presbyterian Church, then headed to Seattle Pacific for seminary, and went on to work with Children of the Nations, which cares for orphaned and vulnerable children around the world. He came to Pine Lake to lead worship, and in 2025, after being ordained in the Covenant, the church called him as an associate pastor.

      Kyle and Joanna have two daughters, Adelyn and Emma. When he isn't leading worship on a Sunday, you might find him working alongside Haitian-Dominican refugees in the Dominican Republic, playing ultimate frisbee, cheering — loyally — for his Colorado teams, or simply at home with his family.
  - name: Kim Witherbee
    title: 'Director, Facilities & Ministries'
    portrait: /assets/images/Kim-2025-5-web.jpg
    bio: |
      Kim has been part of Pine Lake about as long as she can remember — her family started coming when she was two. Over the years she's been up front in worship, in both the music and drama productions, and she joined the staff in 2007. Much of her work now is planning the events that bring people together — the seasonal celebrations and gatherings for the congregation, and the occasions that welcome neighbors who've never set foot here before. She also looks after the property and the groups who rent it, keeping the space well cared for so the church can go on sharing and using it. And she helps oversee the Sunday programs for kids, from preschool through fifth grade.
  - name: Scott Jones
    title: Communications Coordinator
    portrait: /assets/images/Scott-2025-5-web.jpg
    bio: |
      Scott began volunteering graphic design services for PLCC in 2015 and joined as a part-time staff member in 2018. He primarily looks after how the church shows up online — our email newsletter, website, social media channels, and the visual media that hold it all together.
