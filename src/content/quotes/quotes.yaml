quotes:
  - text: Pine Lake Covenant Church truly feels like family. From the moment you
      walk in, people genuinely say hello, start conversations, and make you
      feel seen. I’ve been to other churches before and never really felt
      connected — that’s not the case at Pine Lake at all.
    by: A recent attendee
  - text: I appreciate the solid, Bible-based preaching with practical applications
      for everyday life. I also love how welcoming the service is for families —
      children are included, cared for, and thoughtfully engaged. I felt
      genuinely welcomed the moment I walked in.
    by: A middle-aged family
  - text: I love this place. The people are genuinely kind, and the pastor still
      texts me on my birthday — even when I hadn’t been around for a while. That
      says a lot about how deeply he cares. If you’re looking for a church that
      feels like family, give this one a try.
    by: A Pine Lake congregant
