# Reference only — nothing loads this file.
#
# The homepage carousel reads quotes.yaml next door; this is the working set the
# real quotes were picked out of, kept here so the drafts are visible in the
# current commit rather than only in history.
#
# `real` duplicates what is live in quotes.yaml today. It is a copy, so it does
# not track edits made there or in the CMS — quotes.yaml is the source of truth.
#
# `placeholders` are invented personas written to size the carousel before real
# voices existed. None of them came from a person. They stay out of quotes.yaml
# until a real quote replaces them, and any that survives should arrive with a
# first name attached: see the "Real testimonials" item in PLAN.md and the
# filter test in docs/voice.md.

real:
  - text: Pine Lake Covenant Church truly feels like family. From the moment you
      walk in, people genuinely say hello, start conversations, and make you
      feel seen. I’ve been to other churches before and never really felt
      connected — that’s not the case at Pine Lake at all.
    by: A recent attendee
  - text: I appreciate the solid, Bible-based preaching with practical applications
      for everyday life. I also love how welcoming the service is for families —
      children are included, cared for, and thoughtfully engaged. I felt
      genuinely welcomed the moment I walked in.
    by: A middle-aged family
  - text: I love this place. The people are genuinely kind, and the pastor still
      texts me on my birthday — even when I hadn’t been around for a while. That
      says a lot about how deeply he cares. If you’re looking for a church that
      feels like family, give this one a try.
    by: A Pine Lake congregant

placeholders:
  - text: We’ve been at Pine Lake since the 1990s. What we love is that it still
      feels like a church where people care for each other — and where new
      people are truly welcomed in.
    by: A retired couple
  - text: We came from a larger church and realized we were starting to feel
      anonymous. At Pine Lake, people noticed us — and not in a “salesy” way.
      Just genuinely.
    by: A couple who found a smaller community
  - text: I’m a single mom, and showing up somewhere new can feel like a lot. Pine
      Lake has been a place where my daughter is known and I don’t feel like I
      have to have it all together.
    by: A mom and her young daughter
  - text: We moved into the area with small kids and didn’t know anyone. Pine Lake
      helped us find community faster than we expected — especially through the
      people we met on Sundays.
    by: A family new to Sammamish
  - text: Our kids are older now — one is an adult, one is in the late-teen years —
      and we were looking for a place to settle in for this season. Pine Lake
      has felt grounded and welcoming from the start.
    by: A family looking to put down roots
  # Never shipped: cut in d42e2f6 while the list still lived in src/data/quotes.ts.
  - text: We’re a family who relocated to the US recently, and it mattered to us
      that we’d be welcomed and able to build real friendships. We’ve found
      people here who are kind, curious, and genuinely glad we’re part of the
      church.
    by: A family building community
