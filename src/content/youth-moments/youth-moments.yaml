moments:
  - title: Whidbey Trip
    when: Middle school · June 25–28, 2026
    blurb: A middle school trip built around hands-on service — land preservation and meeting local needs — along with learning indigenous history and culture, exploring Fort Casey and Fort Ebey, kayaking, and unhurried time in Scripture, prayer, and worship.
    featured: true
  - title: Alaska Mission Trip
    when: August 10–17, 2026
    blurb: A team of 20 travels to Nome, Alaska, to serve alongside Nome Covenant Church and local partners — supporting a youth center, helping with bicycle repair and transportation, and partnering with KICY Radio — while learning from local leaders and honoring the culture of the region.
    featured: true
  - title: Fall Thunder Retreat
    when: Middle school · October 9–11, 2026
    blurb: PLY middle schoolers head to Cascades Camp on Elbow Lake in the foothills of Mt. Rainier, joining students from across the Pacific Northwest Conference for a weekend of adventure, worship, teaching, and free-time fun.
    featured: true
  - title: Fall MUD Retreat
    when: High school · November 13–15, 2026
    blurb: Our high schoolers head to Cascades Camp near Yelm, WA, gathering with students from across the Pacific Northwest Conference for a weekend of camp at full volume — games, worship, and teaching.
    featured: true
  - title: Community Meal Packing
    when: December 5, 2026
    blurb: Through our partnership with Children of the Nations, students and their families package meals for children in Sierra Leone. In a few hours, multiple assembly lines in the PLCC gym produce thousands of meals.
    featured: true
  - title: Unite
    when: High school · July 18–23, 2027
    blurb: "A highlight of high school with Pine Lake Youth: a regional gathering with thousands of students from across the west coast for a week of adventure, powerful worship, and teaching — always in an exceptional location. Contact Pastor Becca to be part of the trip."
    featured: true
  - title: Confirmation
    when: 8th grade & up · wraps in June
    blurb: A 6-month track for students in 8th grade and up to dig into following Jesus — mentor relationships, monthly teaching, and Confirmation Sunday in early June.
  - title: Global 6K for Water
    when: Each spring
    blurb: A whole-family walk each spring that helps provide clean water.
  - title: Capernaum Talent Show
    when: Annual
    blurb: An annual event with Young Life Capernaum for students with special needs and their families.
